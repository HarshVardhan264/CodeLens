name: CodeLens CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

  auth:
    name: Auth Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Auth/package-lock.json

      - name: Install dependencies
        working-directory: Auth
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: Auth
        run: node --check app.js

  ai-backend:
    name: Python AI Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python syntax
        working-directory: Backend
        run: python -m compileall -q .

      - name: Run backend tests
        working-directory: Backend
        run: python -m pytest tests/ -v


  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Auth image
        uses: docker/build-push-action@v6
        with:
          context: ./Auth
          push: false

      - name: Build AI Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: false

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: false
          build-args: |
            VITE_API_URL=https://codelens-auth.onrender.com
            VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID }}
  
  notify-vercel:
    name: Notify Vercel
    runs-on: ubuntu-latest
    needs: [frontend, auth, ai-backend, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      statuses: write

    steps:
      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - CodeLens: CI"